<!DOCTYPE html>
<html>
    <head>
        <title>Resume Application </title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <div id="form1" class="setup">
            <h1 id="d1">Personal Details Form </h1>
           
        <label for="name" >Full Name </label>
        <input id="name" type="text" placeholder="Enter your full name " required/>
            </br>
        <label for="email" >Email </label>
        <input id="email" type="email" placeholder="xyzv@gamil.com " required/></br>
        
        <label for="phone">Phone Number </label>
        <input id="phone" type="number" placeholder="1234567897"/></br>
        
        <label for="addres">Address </label>
        <input id="addres" type="text" placeholder="Enter your address"/></br>

        <label for="summary">Porfile Summary </label>
        <input id="summary" type="text" placeholder="Enter your Profile summary"/></br>

        <!-- <label for="file">Profile Image</label>
        <input id="file" type="file" name="upload"/></br> -->

        <button id="addbtn">Add</button>

        </div>

        <div id="form2" style="display: none;" class="setup">

        <h1 id="d1">Education Details Form </h1>
        <label for="degre" >Degree </label>
        <input id="degre" type="text" placeholder="BCA " required/></br>

        <label for="colg" >University</label>
        <input id="colg" type="text" placeholder="CBLU " required/></br>
        
        <label for="year">Completion Year </label>
        <input id="year" type="number" placeholder="2026"/></br>
        
        <label for="cgp">Percentage/CGPA </label>
        <input id="cgp" type="number" step="0.01" placeholder="76.7"/></br>

        <button id="add2">Add</button>
        </div>




        <div id="form3" style="display: none;" class="setup">


            <h1 id="d1">Experience Details Form </h1>
        <label for="company" >Company Name</label>
        <input id="company" type="text" placeholder="comapny name" required/></br>

        <label for="role" >Role</label>
        <input id="role" type="text" placeholder="Manager " required/></br>
        
        <label for="duration">Duration </label>
        <input id="duration" type="number" placeholder="2"/></br>
        
        <label for="decp">Decription </label>
        <input id="decp" type="text"  placeholder="Decription"/></br>

        <button id="add3">Add</button>

        </div>

        <div id="form4" style="display: none;" class="setup">

        <h1 id="d1">Skills Form </h1>
        <label for="skill">Skills </label>
        <input id="skill" type="text" placeholder="Javascript" required/></br>

        <button id="add4">Add</button>

        </div>




        <div id="form5" style="display: none;" class="setup">

        <h1 id="d1">Project Form </h1>

        <label for="title" >Project Title</label>
        <input id="title" type="text" placeholder="Title" required/></br>

        <label for="prodec" >Description</label>
        <input id="prodec" type="text" placeholder="Description"/></br>
        
        <label for="tech">Technologies Used </label>
        <input id="tech" type="text" placeholder="AI"/></br>
        
        <button id="add5">Add</button>
        </div>


        <div id="final">
            <h1 id="resume" style="align-self: anchor-center;"><b>Resume</b> </h1>
        </div>
    </body>
    <script src="./script.js"></script>
</html>
